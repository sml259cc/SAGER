schema_version: sager_paper_config_v2
model:
  hidden_dim: 192
  dropout: 0.1
  temporal_kernels:
  - 1
  - 3
  - 5
  top_k_experts: 2
  cross_modal_layers: 2
  attention_heads: 4
  relation_count: 4
  graph_band_count: 2
  graph_long_distance_minimum: 2
  graph_distance_decay: 0.25
  stable_graph_layers: 2
  stable_graph_alpha: 0.1
  stable_graph_lambda: 0.5
  utility_gate_scale: 1.5
  correction_gate_initial_bias: -2.0
  state_space_hidden_dim: 192
  change_boundary_hidden_dim: 96
  change_reset_initial_bias: -1.0
  path_local_scales:
  - 1
  - 2
  - 4
  tree_parent_top_k: 3
  tree_distance_decay: 0.08
  boundary_prior_scale: 1.0
  implementation_id: sager_paper_v1
objective:
  focal_gamma: 2.0
  final_weight: 1.0
  expert_weight: 0.5
  supervised_contrastive_weight: 0.2
  supervised_contrastive_temperature: 0.07
  directional_kl_weight: 0.005
  spectral_weight: 0.05
  router_balance_weight: 0.002
  counterfactual_utility_weight: 0.25
  utility_huber_delta: 0.5
  change_point_weight: 0.1
  counterfactual_override_weight: 0.1
  relational_proposal_weight: 0.2
  relational_consistency_weight: 0.01
  relational_verifier_weight: 0.1
training:
  batch_dialogues: 8
  joint_epochs: 30
  learning_rate: 8.0e-05
  weight_decay: 1.0e-05
  gradient_clip_norm: 1.0
datasets:
  meld_official:
    class_names:
    - neutral
    - surprise
    - fear
    - sadness
    - joy
    - disgust
    - anger
    train_rows: 9989
    dev_rows: 1109
    test_rows: 2610
